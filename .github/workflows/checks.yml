name: Checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install locked dependencies
        run: |
          python -m pip install uv
          uv sync --locked --python 3.12
      - name: Regression tests
        run: uv run --locked python -m unittest discover -s tests
      - name: JavaScript syntax
        run: |
          node --check web/app.js
          node --check web/report.js
          node --check web/scene.js
          node --check web/workspace.js
      - name: Dependency advisories
        run: uvx pip-audit --path .venv/lib/python3.12/site-packages
  postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: router-test-only
          POSTGRES_DB: router_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install uv==0.13.0
      - run: uv sync --locked --python 3.12
      - run: uv run --locked python tests/postgres_check.py
        env:
          ROUTER_TEST_DATABASE_URL: postgresql+psycopg://postgres:router-test-only@127.0.0.1:5432/router_test
